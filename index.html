<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Xtrema - PWA App</title>
    
    <!-- PWA Primary Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radio Xtrema">
    <link rel="apple-touch-icon" href="https://i.ibb.co/PZRkN7qK/RADIO-XTREMA.jpg">
    <link rel="icon" type="image/jpg" href="https://i.ibb.co/PZRkN7qK/RADIO-XTREMA.jpg">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a192f 0%, #0d47a1 50%, #1565c0 100%);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-sub: #e0e0e0;
            --accent: #00e5ff;
            --btn-bg: #ffffff;
            --btn-text: #0d47a1;
        }

        [data-theme="blue-white"] {
            --bg-gradient: linear-gradient(135deg, #0a192f 0%, #0d47a1 50%, #1565c0 100%);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-sub: #e0e0e0;
            --accent: #00e5ff;
            --btn-bg: #ffffff;
            --btn-text: #0d47a1;
        }

        [data-theme="light-blue"] {
            --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(13, 71, 161, 0.2);
            --text-main: #0d47a1;
            --text-sub: #1565c0;
            --accent: #0288d1;
            --btn-bg: #0d47a1;
            --btn-text: #ffffff;
        }

        [data-theme="dark-neon"] {
            --bg-gradient: linear-gradient(135deg, #000000 0%, #121212 50%, #1a1a2e 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 229, 255, 0.3);
            --text-main: #ffffff;
            --text-sub: #b0bec5;
            --accent: #00e5ff;
            --btn-bg: #00e5ff;
            --btn-text: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            padding: 20px 15px;
            transition: background 0.5s ease;
        }

        /* Banner de instalación PWA arriba */
        .install-banner {
            width: 100%;
            max-width: 420px;
            background: rgba(0, 229, 255, 0.2);
            border: 1px solid var(--accent);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .install-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .install-info i {
            font-size: 20px;
            color: var(--accent);
        }

        .btn-banner-install {
            background: var(--accent);
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.4);
        }

        .btn-banner-install:hover {
            transform: scale(1.05);
        }

        /* Tarjeta del Reproductor */
        .player-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 28px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
            margin: auto;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .live-tag {
            background: #ff1744;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
            animation: pulse-red 2s infinite;
        }

        .live-tag::before {
            content: '';
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 23, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
        }

        .theme-select {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .theme-select option {
            background: #0d47a1;
            color: #ffffff;
        }

        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, var(--accent), #ffffff);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .station-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffffff;
        }

        .station-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .station-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 18px;
        }

        /* Visualizador de Ecualizador */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            height: 35px;
            margin-bottom: 22px;
        }

        .bar {
            width: 4px;
            height: 8px;
            background: var(--accent);
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .bar:nth-child(5) { animation-delay: 0.4s; }
        .playing .bar:nth-child(6) { animation-delay: 0.6s; }
        .playing .bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 8px; }
            100% { height: 32px; background: var(--text-main); }
        }

        /* Botón de Play */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .play-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.08);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .volume-container i {
            font-size: 16px;
            color: var(--text-sub);
            width: 20px;
        }

        .volume-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--btn-bg);
            cursor: pointer;
        }

        footer {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        footer strong {
            color: var(--text-main);
            font-weight: 700;
        }

        footer .whatsapp-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #25d366;
            text-decoration: none;
            font-weight: 700;
            margin-top: 5px;
            background: rgba(37, 211, 102, 0.15);
            padding: 5px 14px;
            border-radius: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(37, 211, 102, 0.3);
        }

        footer .whatsapp-link:hover {
            background: rgba(37, 211, 102, 0.3);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="blue-white">

    <!-- Banner de Instalación App en PC y Celular -->
    <div class="install-banner" id="installBanner" style="display: none;">
        <div class="install-info">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span>Instalar App Oficial</span>
        </div>
        <button class="btn-banner-install" id="installBtn">INSTALAR</button>
    </div>

    <div class="player-card">
        <div class="header">
            <div class="live-tag">EN VIVO</div>
            <select class="theme-select" id="themeSelect">
                <option value="blue-white">Azul y Blanco</option>
                <option value="light-blue">Blanco Elegante</option>
                <option value="dark-neon">Modo Oscuro</option>
            </select>
        </div>

        <div class="logo-container">
            <img src="https://i.ibb.co/PZRkN7qK/RADIO-XTREMA.jpg" alt="Radio Xtrema Logo" class="station-logo">
        </div>

        <h1 class="station-title">Radio Xtrema</h1>
        <p class="station-subtitle" id="statusText">Presiona Play para escuchar</p>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="controls">
            <button class="play-btn" id="playBtn" title="Reproducir / Pausar">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
        </div>

        <div class="volume-container">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
    </div>

    <footer>
        <p>Diseñado por <strong>DJ WILMER</strong></p>
        <a href="https://wa.me/51980634177" target="_blank" class="whatsapp-link">
            <i class="fa-brands fa-whatsapp"></i> CONTACTOS: 980634177
        </a>
    </footer>

    <audio id="audioPlayer" src="https://stream-177.surfernetwork.com/vv557vfe21zuv" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const visualizer = document.getElementById('visualizer');
        const statusText = document.getElementById('statusText');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const themeSelect = document.getElementById('themeSelect');

        let isPlaying = false;

        // Selección de temas
        themeSelect.addEventListener('change', (e) => {
            document.body.setAttribute('data-theme', e.target.value);
            localStorage.setItem('radio_theme', e.target.value);
        });

        const savedTheme = localStorage.getItem('radio_theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            themeSelect.value = savedTheme;
        }

        // Control Reproductor Audio
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = 'fa-solid fa-pause';
                    visualizer.classList.add('playing');
                    statusText.textContent = 'En Vivo - Transmitiendo';
                }).catch(err => {
                    statusText.textContent = 'Error al reproducir audio';
                    console.error(err);
                });
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.className = 'fa-solid fa-play';
                visualizer.classList.remove('playing');
                statusText.textContent = 'En pausa';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val;
            if (val == 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (val < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        });

        // Evento de Instalación PWA (Móvil y PC)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBanner.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        });

        // Ocultar banner si ya está instalada la app
        window.addEventListener('appinstalled', () => {
            installBanner.style.display = 'none';
            console.log('PWA instalada exitosamente');
        });

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service Worker error:', err));
            });
        }
    </script>
</body>
</html>
